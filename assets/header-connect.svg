<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64"><style>text{font-family:Arial,sans-serif}@keyframes pulse{50%{opacity:.25}}@keyframes flow{to{stroke-dashoffset:-180}}.pulse{animation:pulse 3s infinite}.flow{animation:flow 4s linear infinite}@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}</style><defs><linearGradient id="g"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs><circle class="pulse" cx="23" cy="28" r="18" fill="#10273b" stroke="#38bdf8"/><text x="23" y="35" fill="#38bdf8" font-size="23" text-anchor="middle">↗</text><text x="56" y="37" fill="url(#g)" font-size="26" font-weight="700">Let’s Connect</text><text x="895" y="35" fill="#5b7896" font-size="13" text-anchor="end">06 /</text><path d="M0 61H900" stroke="#1e3a5f" stroke-width="2"/><path class="flow" d="M0 61H900" stroke="url(#g)" stroke-width="3" stroke-dasharray="100 80"/></svg>