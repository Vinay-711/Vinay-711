<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8"><style>text{font-family:Arial,sans-serif}@keyframes pulse{50%{opacity:.25}}@keyframes flow{to{stroke-dashoffset:-180}}.pulse{animation:pulse 3s infinite}.flow{animation:flow 4s linear infinite}@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}</style><defs><linearGradient id="r"><stop stop-color="#f87171"/><stop offset=".2" stop-color="#fbbf24"/><stop offset=".4" stop-color="#4ade80"/><stop offset=".6" stop-color="#38bdf8"/><stop offset=".8" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/></linearGradient></defs><rect width="900" height="3" y="2" rx="2" fill="url(#r)"/></svg>